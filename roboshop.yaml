  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    instances:
      - mongodb
    action: create
    domain_name: sandhya.com
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        state: present
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

  