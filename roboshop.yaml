- name: Create Roboshop EC2 instances using AWS CLI
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yaml

  tasks:
    - name: Find security group IDs
      ansible.builtin.shell: >
        aws ec2 describe-security-groups
        --region {{ region }}
        --group-names roboshop-common roboshop-{{ item }}
        --query "SecurityGroups[].GroupId"
        --output text
      loop: "{{ components }}"
      register: sg_results
      changed_when: false

    - name: Create EC2 instances
      ansible.builtin.shell: |
        aws ec2 run-instances 
          --region {{ region }} 
          --image-id {{ ami_id }} 
          --instance-type {{ instance_type }} 
          --security-group-ids {{ item.stdout }} 
          --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=roboshop-{{ item.item }}}]' 
          --query 'Instances[0].InstanceId' 
          --output text
      loop: "{{ sg_results.results }}"
      register: ec2_results

    - name: Display created instance IDs
      ansible.builtin.debug:
        msg: "{{ item.item.item }} : {{ item.stdout }}"
      loop: "{{ ec2_results.results }}"