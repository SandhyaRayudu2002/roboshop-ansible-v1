- name: Create EC2 instances for Roboshop
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars.yaml

  tasks:
    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        security_groups: "{{ security_groups }}"
        region: us-east-1
        network:
          assign_public_ip: true
        tags:
          Name: "roboshop-{{ item }}"
      loop:
        - mongodb
        - redis
        - catalogue
        - user
        - cart
        - mysql
        - shipping
        - rabbitmq
        - frontend