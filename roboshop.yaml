---
- name: Create EC2 instances and R53 records
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ansible-playbook roboshop.yaml -e "instances=['mongodb', 'redis']"

    instances:
      - mongodb
      - redis
      - mysql
      - rabbitmq
      - catalogue
      - user
      - cart
      - shipping
      - payment
      - frontend

    action: create
    domain_name: sandhya.com
    ami_id: ami-0055977a6e828a4f4
    region: us-east-1

  tasks:

    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: t3.micro
        security_groups:
          - roboshop-common
          - "roboshop-{{ item }}"
        region: "{{ region }}"
        state: present
        wait: true
      loop: "{{ instances }}"
      when: action == "create"
      register: ec2_output

    - name: Create Route53 records for components
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}.{{ domain_name }}"
        type: A
        ttl: 300
        value: "{{ item.instances[0].private_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.item != "frontend"
        - item.instances is defined
        - item.instances | length > 0

    - name: Create Route53 record for frontend
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        ttl: 300
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
      loop: "{{ ec2_output.results }}"
      when:
        - action == "create"
        - item.item == "frontend"
        - item.instances is defined
        - item.instances | length > ---
